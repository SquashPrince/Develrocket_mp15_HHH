<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444c56"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="470" fill="#f7f8fa"/>

  <!-- 왼쪽 : 좌 · 우 돌기 -->
  <text x="250" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">좌 · 우 돌기</text>

  <circle cx="250" cy="220" r="120" fill="none" stroke="#2f6fdd" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="250" y="88" text-anchor="middle" font-size="13" fill="#2f6fdd">유지 거리</text>

  <!-- 앞선 각도 -->
  <line x1="250" y1="220" x2="130" y2="220" stroke="#8c959f" stroke-width="1.2"/>
  <line x1="250" y1="220" x2="146.1" y2="160" stroke="#8c959f" stroke-width="1.2"/>
  <path d="M200,220 A50,50 0 0,1 206.7,195" fill="none" stroke="#8c959f" stroke-width="1.2"/>
  <text x="146" y="213" font-size="11" fill="#57606a">앞선 각도</text>

  <!-- 대상 -->
  <circle cx="250" cy="220" r="9" fill="#2f6fdd"/>
  <text x="250" y="246" text-anchor="middle" font-size="13" fill="#1f2328">대상 (플레이어)</text>

  <!-- 원 위의 적과 목표 지점 -->
  <path d="M130,220 A120,120 0 0,1 144,166" fill="none" stroke="#444c56" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="146.1" cy="160" r="7" fill="#e6a700"/>
  <text x="136" y="150" text-anchor="end" font-size="13" fill="#1f2328">목표 지점</text>
  <circle cx="130" cy="220" r="9" fill="#d1495b"/>
  <text x="116" y="216" text-anchor="end" font-size="13" fill="#1f2328">적</text>
  <text x="116" y="232" text-anchor="end" font-size="12" fill="#57606a">(지금 위치)</text>
  <text x="104" y="186" text-anchor="end" font-size="12" fill="#57606a">도는 방향</text>

  <!-- 멀어진 적 -->
  <line x1="155" y1="384.5" x2="147.5" y2="292" stroke="#444c56" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <circle cx="146.1" cy="280" r="6" fill="#e6a700"/>
  <circle cx="155" cy="384.5" r="9" fill="#d1495b"/>
  <text x="172" y="389" font-size="13" fill="#1f2328">멀어진 적</text>
  <text x="138" y="334" text-anchor="end" font-size="12" fill="#57606a">원 쪽 목표 지점으로</text>
  <text x="138" y="349" text-anchor="end" font-size="12" fill="#57606a">추적 속도로 다가감</text>

  <text x="250" y="438" text-anchor="middle" font-size="12.5" fill="#57606a">목표 지점이 늘 도는 방향으로 앞서 있어,</text>
  <text x="250" y="455" text-anchor="middle" font-size="12.5" fill="#57606a">거리를 맞추면서 원을 따라 돌게 된다</text>

  <!-- 구분선 -->
  <line x1="520" y1="20" x2="520" y2="450" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- 오른쪽 : 백스텝 -->
  <text x="660" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2328">백스텝</text>

  <line x1="660" y1="166" x2="660" y2="96" stroke="#d1495b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="672" y="122" font-size="12.5" fill="#1f2328">대상 반대쪽으로</text>
  <text x="672" y="138" font-size="12.5" fill="#1f2328">물러남</text>

  <circle cx="660" cy="176" r="9" fill="#d1495b"/>
  <text x="646" y="181" text-anchor="end" font-size="13" fill="#1f2328">적</text>

  <line x1="660" y1="190" x2="660" y2="226" stroke="#444c56" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="672" y="214" font-size="12" fill="#57606a">대상을 바라봄</text>

  <circle cx="660" cy="250" r="9" fill="#2f6fdd"/>
  <text x="660" y="276" text-anchor="middle" font-size="13" fill="#1f2328">대상 (플레이어)</text>

  <text x="660" y="330" text-anchor="middle" font-size="12.5" fill="#57606a">거리 유지를 시작할 때</text>
  <text x="660" y="347" text-anchor="middle" font-size="12.5" fill="#57606a">확률로 좌 · 우 돌기 대신 선택</text>
  <text x="660" y="372" text-anchor="middle" font-size="12.5" fill="#57606a">백스텝 모션이 끝나면 멈춘다</text>
</svg>
