<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#F7F7F5"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#1F2328">전투 화면 UI 배치 (위치 예시, 크기 · 디자인 미정)</text>

  <!-- 게임 화면 16:9 -->
  <rect x="20" y="60" width="960" height="540" fill="#E6E8EB" stroke="#1F2328" stroke-width="2"/>

  <!-- 왼쪽 상단: 캐릭터 3명 -->
  <g>
    <rect x="40" y="80" width="250" height="56" fill="#FFFFFF" stroke="#0969DA" stroke-width="3"/>
    <text x="52" y="100" font-size="12" font-weight="bold" fill="#0969DA">현재 캐릭터</text>
    <rect x="52" y="108" width="150" height="9" fill="#2DA44E"/><text x="210" y="117" font-size="11" fill="#1F2328">체력</text>
    <rect x="52" y="123" width="110" height="7" fill="#D4A72C"/><text x="170" y="131" font-size="11" fill="#1F2328">에너지</text>

    <rect x="40" y="144" width="250" height="46" fill="#FFFFFF" stroke="#8C959F"/>
    <text x="52" y="162" font-size="12" fill="#57606A">대기 캐릭터 1</text>
    <rect x="52" y="169" width="130" height="7" fill="#2DA44E"/>
    <rect x="52" y="179" width="70" height="5" fill="#D4A72C"/>

    <rect x="40" y="198" width="250" height="46" fill="#FFFFFF" stroke="#8C959F"/>
    <text x="52" y="216" font-size="12" fill="#57606A">대기 캐릭터 2</text>
    <rect x="52" y="223" width="90" height="7" fill="#2DA44E"/>
    <rect x="52" y="233" width="120" height="5" fill="#D4A72C"/>

    <rect x="40" y="252" width="250" height="30" fill="#FFFFFF" stroke="#8250DF" stroke-dasharray="5 3"/>
    <text x="52" y="272" font-size="12" fill="#8250DF">필살기 게이지 (현재 캐릭터만, 위치 미정)</text>
  </g>

  <!-- 오른쪽 상단: 보스 그로기 -->
  <rect x="640" y="80" width="320" height="50" fill="#FFFFFF" stroke="#CF222E" stroke-width="2"/>
  <text x="652" y="100" font-size="12" font-weight="bold" fill="#CF222E">보스 그로기</text>
  <rect x="652" y="110" width="296" height="10" fill="#FFEBE9" stroke="#CF222E"/>
  <rect x="652" y="110" width="180" height="10" fill="#CF222E"/>

  <!-- 플레이어 -->
  <circle cx="420" cy="470" r="26" fill="#0969DA"/>
  <text x="420" y="520" font-size="12" fill="#1F2328" text-anchor="middle">플레이어</text>

  <!-- 일반 적 -->
  <circle cx="230" cy="400" r="22" fill="#57606A"/>
  <rect x="200" y="362" width="60" height="7" fill="#FFFFFF" stroke="#1F2328"/>
  <rect x="200" y="362" width="25" height="7" fill="#CF222E"/>
  <text x="230" y="354" font-size="11" fill="#1F2328" text-anchor="middle">그로기 (머리 위)</text>
  <text x="230" y="442" font-size="12" fill="#1F2328" text-anchor="middle">일반 적</text>

  <!-- 보스 + 록온 + 예고 -->
  <circle cx="640" cy="350" r="48" fill="#57606A"/>
  <circle cx="640" cy="350" r="56" fill="none" stroke="#D4A72C" stroke-width="5"/>
  <text x="712" y="318" font-size="12" fill="#9A6700">노란 예고 (적에게서 표시)</text>
  <path d="M640 280 l-10 -14 h20 z M640 420 l-10 14 h20 z M570 350 l-14 -10 v20 z M710 350 l14 -10 v20 z" fill="#0969DA"/>
  <text x="712" y="390" font-size="12" fill="#0969DA">록온 마커</text>
  <text x="640" y="455" font-size="12" fill="#1F2328" text-anchor="middle">보스</text>

  <!-- 범례 -->
  <text x="40" y="585" font-size="11" fill="#57606A">체력 · 에너지는 3명 모두 표시 · 콤보 스킬 선택 UI는 그로기 시 별도 표시 · Esc 메뉴는 일시정지 화면</text>
</svg>
