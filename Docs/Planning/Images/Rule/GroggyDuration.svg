<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1000" height="340" fill="#F7F7F5"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#1F2328">그로기 지속시간 계산 (예시)</text>
  <text x="30" y="62" font-size="12" fill="#57606A">가로축: 시간 (막대 길이는 실제 시간 비율). 기본 12초 · 최대 15초. 콤보 스킬 시전 시작 1초는 시간이 줄지 않고 최대 시간에도 포함되지 않는다.</text>

  <!-- 최대 시간 계산에 포함되는 부분 -->
  <text x="30" y="122" font-size="13" font-weight="bold" fill="#1F2328">최대 15초</text>
  <text x="30" y="140" font-size="11" fill="#57606A">계산에 포함</text>
  <rect x="120" y="100" width="540" height="44" fill="#CF222E"/>
  <text x="390" y="127" font-size="14" fill="#FFFFFF" text-anchor="middle">기본 12초</text>
  <rect x="660" y="100" width="135" height="44" fill="#FF8182"/>
  <text x="727" y="120" font-size="12" fill="#1F2328" text-anchor="middle">특수 스킬로 증가</text>
  <text x="727" y="136" font-size="12" fill="#1F2328" text-anchor="middle">+3초</text>
  <line x1="795" y1="86" x2="795" y2="156" stroke="#1F2328" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="795" y="80" font-size="12" fill="#1F2328" text-anchor="middle">최대 15초</text>

  <!-- 최대 시간 계산에 포함되지 않는 부분 -->
  <text x="30" y="202" font-size="13" font-weight="bold" fill="#1F2328">정지 시간</text>
  <text x="30" y="220" font-size="11" fill="#57606A">계산에서 제외</text>
  <rect x="120" y="180" width="45" height="44" fill="#0969DA"/>
  <rect x="300" y="180" width="45" height="44" fill="#0969DA"/>
  <rect x="480" y="180" width="45" height="44" fill="#0969DA"/>
  <text x="142" y="207" font-size="12" fill="#FFFFFF" text-anchor="middle">1초</text>
  <text x="322" y="207" font-size="12" fill="#FFFFFF" text-anchor="middle">1초</text>
  <text x="502" y="207" font-size="12" fill="#FFFFFF" text-anchor="middle">1초</text>
  <text x="142" y="242" font-size="11" fill="#0969DA" text-anchor="middle">콤보 1</text>
  <text x="322" y="242" font-size="11" fill="#0969DA" text-anchor="middle">콤보 2</text>
  <text x="502" y="242" font-size="11" fill="#0969DA" text-anchor="middle">콤보 3</text>
  <text x="560" y="207" font-size="11" fill="#57606A">각 콤보 스킬 시전 시작 1초 (발동 위치는 예시)</text>

  <!-- 합계 -->
  <rect x="120" y="270" width="810" height="30" fill="#FFFFFF" stroke="#1F2328"/>
  <rect x="120" y="270" width="675" height="30" fill="#FFEBE9"/>
  <rect x="795" y="270" width="135" height="30" fill="#DDF4FF"/>
  <text x="457" y="290" font-size="13" fill="#1F2328" text-anchor="middle">12초 + 특수 스킬 3초 = 15초 (최대)</text>
  <text x="862" y="290" font-size="13" fill="#1F2328" text-anchor="middle">+ 정지 3초</text>
  <text x="30" y="290" font-size="13" font-weight="bold" fill="#1F2328">실질 18초</text>
  <text x="930" y="320" font-size="11" fill="#57606A" text-anchor="end">끝나면 그로기 게이지는 0부터 다시 쌓인다</text>
</svg>
