<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1000" height="500" fill="#F7F7F5"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#1F2328">완벽 회피 · 패링 타이밍</text>
  <text x="30" y="62" font-size="12" fill="#57606A">가로축: 시간 (막대 길이는 실제 시간 비율). 각 줄은 서로 다른 상황이며 시작 시점이 다르다.</text>

  <!-- 완벽 회피 -->
  <text x="30" y="118" font-size="15" font-weight="bold" fill="#1F2328">완벽 회피</text>
  <line x1="140" y1="95" x2="140" y2="215" stroke="#1F2328" stroke-width="2"/>
  <text x="140" y="88" font-size="12" fill="#1F2328" text-anchor="middle">회피 키 입력</text>
  <rect x="140" y="100" width="60" height="28" fill="#2DA44E"/>
  <text x="170" y="119" font-size="12" fill="#FFFFFF" text-anchor="middle">0.15초</text>
  <text x="208" y="119" font-size="12" fill="#1F2328">← 이 안에 적 공격이 닿으면 완벽 회피</text>
  <line x1="185" y1="134" x2="185" y2="215" stroke="#CF222E" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="191" y="148" font-size="12" fill="#CF222E">적 공격 닿음 (예)</text>
  <rect x="185" y="156" width="400" height="26" fill="#0969DA"/>
  <text x="385" y="174" font-size="12" fill="#FFFFFF" text-anchor="middle">슬로모션 1초 (실제 시간 기준, 0.5배속)</text>
  <rect x="185" y="186" width="400" height="22" fill="#DDF4FF" stroke="#0969DA"/>
  <text x="385" y="202" font-size="12" fill="#0969DA" text-anchor="middle">회피 반격 입력 가능</text>
  <!-- 축 -->
  <line x1="140" y1="222" x2="600" y2="222" stroke="#8C959F"/>
  <text x="140" y="238" font-size="11" fill="#57606A" text-anchor="middle">0</text>
  <text x="200" y="238" font-size="11" fill="#57606A" text-anchor="middle">0.15</text>
  <text x="585" y="238" font-size="11" fill="#57606A" text-anchor="middle">적중 + 1초</text>

  <line x1="30" y1="258" x2="970" y2="258" stroke="#D0D7DE"/>

  <!-- 패링 -->
  <text x="30" y="306" font-size="15" font-weight="bold" fill="#1F2328">패링</text>
  <rect x="140" y="288" width="300" height="28" fill="#D4A72C"/>
  <text x="290" y="307" font-size="12" fill="#1F2328" text-anchor="middle">노란 예고 지속 (길이는 공격마다 다름)</text>
  <rect x="440" y="288" width="60" height="28" fill="#F5E0A3" stroke="#D4A72C"/>
  <text x="470" y="307" font-size="12" fill="#1F2328" text-anchor="middle">+0.15초</text>
  <path d="M140 326 v8 h360 v-8" fill="none" stroke="#1F2328"/>
  <text x="320" y="350" font-size="12" fill="#1F2328" text-anchor="middle">패링 입력 가능 구간</text>

  <line x1="420" y1="360" x2="420" y2="455" stroke="#1F2328" stroke-width="2"/>
  <text x="420" y="374" font-size="12" fill="#1F2328" text-anchor="end" dx="-6">패링 입력 (예)</text>
  <rect x="420" y="382" width="400" height="28" fill="#8250DF"/>
  <text x="620" y="401" font-size="12" fill="#FFFFFF" text-anchor="middle">패링 모션 · 밀려남 1초 (추격 입력 받음)</text>
  <text x="620" y="428" font-size="11" fill="#57606A" text-anchor="middle">패링 공격이 또 오면 자동 패링, 1초 초기화, 이전 입력 사라짐</text>

  <rect x="820" y="382" width="150" height="28" fill="#1A7F37"/>
  <text x="895" y="401" font-size="12" fill="#FFFFFF" text-anchor="middle">추격 공격 (무적)</text>
  <text x="895" y="428" font-size="11" fill="#57606A" text-anchor="middle">입력 없었으면 종료</text>
  <!-- 축 -->
  <line x1="420" y1="462" x2="830" y2="462" stroke="#8C959F"/>
  <text x="420" y="478" font-size="11" fill="#57606A" text-anchor="middle">입력</text>
  <text x="820" y="478" font-size="11" fill="#57606A" text-anchor="middle">입력 + 1초</text>
</svg>
