<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1000" height="540" rx="18" fill="#15171E"/>
  <text x="36" y="48" font-size="22" font-weight="bold" fill="#F5F5F7">완벽 회피 &amp; 패링 — 타이밍 한눈에 보기</text>
  <text x="36" y="72" font-size="12" fill="#9BA1AE">막대 길이 = 실제 시간 비율 · 위아래는 서로 다른 상황</text>

  <!-- 완벽 회피 카드 -->
  <rect x="24" y="92" width="952" height="190" rx="12" fill="#1E212B"/>
  <text x="44" y="122" font-size="16" font-weight="bold" fill="#5EEAD4">PERFECT DODGE</text>
  <text x="44" y="142" font-size="12" fill="#9BA1AE">완벽 회피</text>
  <circle cx="200" cy="170" r="7" fill="#F5F5F7"/>
  <text x="200" y="196" font-size="11" fill="#F5F5F7" text-anchor="middle">회피 키</text>
  <rect x="200" y="158" width="60" height="24" rx="6" fill="#5EEAD4"/>
  <text x="230" y="175" font-size="12" font-weight="bold" fill="#0B3B36" text-anchor="middle">0.15s</text>
  <path d="M245 150 l0 -14" stroke="#FF5C7A" stroke-width="2"/>
  <text x="252" y="140" font-size="11" fill="#FF5C7A">적 공격 HIT!</text>
  <rect x="245" y="206" width="400" height="26" rx="6" fill="#6C8CFF"/>
  <text x="445" y="224" font-size="12" fill="#FFFFFF" text-anchor="middle">슬로모션 1s · Time.timeScale 0.5 · unscaled 시간으로 측정</text>
  <rect x="245" y="238" width="400" height="22" rx="6" fill="none" stroke="#6C8CFF" stroke-dasharray="5 4"/>
  <text x="445" y="254" font-size="12" fill="#AFC0FF" text-anchor="middle">이 동안 공격 → 회피 반격 (대시 공격보다 우선)</text>
  <text x="670" y="175" font-size="12" fill="#9BA1AE">0.15초 안에 맞으면 성공.</text>
  <text x="670" y="193" font-size="12" fill="#9BA1AE">실패하면 그냥 대시 · 회피.</text>

  <!-- 패링 카드 -->
  <rect x="24" y="298" width="952" height="222" rx="12" fill="#1E212B"/>
  <text x="44" y="328" font-size="16" font-weight="bold" fill="#FFD23F">PARRY</text>
  <text x="44" y="348" font-size="12" fill="#9BA1AE">패링 (C / Space)</text>
  <rect x="200" y="318" width="280" height="26" rx="6" fill="#FFD23F"/>
  <text x="340" y="336" font-size="12" font-weight="bold" fill="#3A2E00" text-anchor="middle">노란 예고 (길이 가변)</text>
  <rect x="480" y="318" width="60" height="26" rx="6" fill="#FFD23F" fill-opacity="0.35" stroke="#FFD23F"/>
  <text x="510" y="336" font-size="12" fill="#FFE98A" text-anchor="middle">+0.15s</text>
  <text x="560" y="336" font-size="12" fill="#9BA1AE">← 여기까지 입력하면 패링</text>

  <circle cx="440" cy="378" r="7" fill="#F5F5F7"/>
  <text x="430" y="383" font-size="11" fill="#F5F5F7" text-anchor="end">입력</text>
  <rect x="440" y="366" width="400" height="26" rx="6" fill="#B47CFF"/>
  <text x="640" y="384" font-size="12" fill="#FFFFFF" text-anchor="middle">패링 모션 · 밀려남 1s  (카메라 흔들림)</text>
  <rect x="840" y="366" width="120" height="26" rx="6" fill="#3DDC84"/>
  <text x="900" y="384" font-size="12" font-weight="bold" fill="#0B2E1A" text-anchor="middle">추격 (무적)</text>

  <text x="200" y="424" font-size="12" fill="#F5F5F7">밀려나는 1초 동안</text>
  <text x="200" y="446" font-size="12" fill="#9BA1AE">• 추격 키를 눌렀다 → 밀려남이 끝나면 추격 공격 / 안 눌렀다 → 그대로 종료</text>
  <text x="200" y="466" font-size="12" fill="#9BA1AE">• 노란 공격이 또 온다 → 자동 패링, 1초 다시 시작, 이전 추격 입력은 사라짐</text>
  <text x="200" y="486" font-size="12" fill="#9BA1AE">• 그래서 연속 패링 패턴은 공격 간격을 1초 이내로 설계</text>
  <text x="200" y="506" font-size="12" fill="#FF8FA3">• 추격 무적 중에 온 노란 공격은 패링되지 않고 통과 (의도한 동작)</text>
</svg>
