<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="1000" height="600" rx="18" fill="#15171E"/>
  <text x="36" y="44" font-size="22" font-weight="bold" fill="#F5F5F7">전투 HUD 목업</text>
  <text x="200" y="44" font-size="12" fill="#9BA1AE">위치 예시 · 크기와 디자인은 꾸미기 단계에서 결정</text>

  <!-- 화면 -->
  <rect x="24" y="64" width="952" height="512" rx="10" fill="#22303C"/>
  <rect x="24" y="420" width="952" height="156" fill="#1B2630"/>

  <!-- 왼쪽 상단 파티 -->
  <rect x="44" y="84" width="260" height="62" rx="10" fill="#0E141A" fill-opacity="0.85" stroke="#5EEAD4" stroke-width="2"/>
  <circle cx="74" cy="115" r="18" fill="#5EEAD4"/>
  <text x="74" y="120" font-size="12" font-weight="bold" fill="#0B3B36" text-anchor="middle">1</text>
  <rect x="102" y="102" width="170" height="10" rx="5" fill="#3DDC84"/>
  <rect x="102" y="118" width="120" height="7" rx="3" fill="#FFD23F"/>
  <rect x="102" y="130" width="90" height="7" rx="3" fill="#B47CFF"/>
  <text x="280" y="111" font-size="10" fill="#9BA1AE">HP</text>
  <text x="228" y="125" font-size="10" fill="#9BA1AE">EN</text>
  <text x="198" y="137" font-size="10" fill="#C9A7FF">ULT</text>

  <rect x="44" y="154" width="200" height="40" rx="10" fill="#0E141A" fill-opacity="0.7"/>
  <circle cx="68" cy="174" r="13" fill="#6C8CFF"/>
  <text x="68" y="178" font-size="11" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="90" y="166" width="130" height="7" rx="3" fill="#3DDC84"/>
  <rect x="90" y="178" width="70" height="5" rx="2" fill="#FFD23F"/>

  <rect x="44" y="200" width="200" height="40" rx="10" fill="#0E141A" fill-opacity="0.7"/>
  <circle cx="68" cy="220" r="13" fill="#FF9F43"/>
  <text x="68" y="224" font-size="11" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="90" y="212" width="90" height="7" rx="3" fill="#3DDC84"/>
  <rect x="90" y="224" width="120" height="5" rx="2" fill="#FFD23F"/>
  <text x="44" y="260" font-size="11" fill="#9BA1AE">파티 3명 HP · 에너지 / 필살기(ULT)는 현재 캐릭터만</text>

  <!-- 오른쪽 상단 보스 -->
  <text x="956" y="96" font-size="13" font-weight="bold" fill="#F5F5F7" text-anchor="end">BOSS</text>
  <rect x="636" y="106" width="320" height="12" rx="6" fill="#3A2230"/>
  <rect x="636" y="106" width="200" height="12" rx="6" fill="#FF5C7A"/>
  <text x="956" y="136" font-size="11" fill="#FF8FA3" text-anchor="end">그로기 게이지</text>

  <!-- 일반 적 -->
  <rect x="190" y="318" width="56" height="6" rx="3" fill="#3A2230"/>
  <rect x="190" y="318" width="22" height="6" rx="3" fill="#FF5C7A"/>
  <circle cx="218" cy="356" r="22" fill="#4B5563"/>
  <text x="218" y="396" font-size="11" fill="#9BA1AE" text-anchor="middle">일반 적 (그로기는 머리 위)</text>

  <!-- 보스 -->
  <circle cx="640" cy="330" r="60" fill="#FFD23F" fill-opacity="0.18"/>
  <circle cx="640" cy="330" r="46" fill="#4B5563" stroke="#FFD23F" stroke-width="4"/>
  <path d="M598 288 h16 M598 288 v16 M682 288 h-16 M682 288 v16 M598 372 h16 M598 372 v-16 M682 372 h-16 M682 372 v-16" stroke="#5EEAD4" stroke-width="3" fill="none"/>
  <text x="720" y="300" font-size="12" fill="#FFE98A">노란 섬광 = 패링 가능</text>
  <text x="720" y="320" font-size="12" fill="#FF8FA3">빨간 섬광 = 회피만</text>
  <text x="720" y="350" font-size="12" fill="#5EEAD4">록온 브래킷 (휠 클릭)</text>

  <!-- 플레이어 -->
  <circle cx="440" cy="470" r="24" fill="#5EEAD4"/>
  <text x="440" y="512" font-size="11" fill="#9BA1AE" text-anchor="middle">플레이어</text>

  <!-- 하단 안내 -->
  <text x="44" y="560" font-size="11" fill="#9BA1AE">Esc → 일시정지 메뉴 (설정 · 재시작 · 소리)  ·  그로기 시 콤보 선택 UI 별도 표시</text>
</svg>
